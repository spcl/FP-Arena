name: Publish

# A published GitHub release (helpers/release_patch.sh creates it on the tag) uploads that tag's wheel and sdist to
# PyPI through Trusted Publishing (OIDC: no token anywhere) and attaches the same files to the release, so the tag, the
# release and PyPI always hold one build. PyPI trusts this repository, this file and the `pypi` environment
# (pypi.org: project -> Settings -> Publishing).

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v6
      - name: Build and check
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "${{ github.event.release.tag_name }}" == *"v${version}" ]] || { echo "tag does not name version ${version}" >&2; exit 1; }
          uv build
          uvx twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Attach the uploaded files to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
