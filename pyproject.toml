[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-arena"
version = "0.1.0"
description = "A rapid-prototyping environment for custom floating-point types in DaCe"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "ETH Zurich and the FP-Arena authors" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
]
keywords = ["dace", "floating-point", "stochastic-rounding", "reduced-precision", "prototyping"]

# DaCe comes through one of two extras, never both (each installs the `dace` package): `extended` (dace-extended, the
# whole of FP-Arena) or `dace` (spcl's dace; the types and change_and_propagate_fp_types, not fp_arena.search, which
# needs extended's vectorization passes). With your own DaCe checkout, install FP-Arena without an extra.
dependencies = [
    "numpy",
    "ordered-set",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
extended = ["dace-extended>=1.0.0"]
dace = ["dace>=2.0.0b2"]
testing = [
    "pytest",
    "pytest-xdist",
]
corpus = [
    "h5py",
]
dev = [
    "fp-arena[testing,extended]",
]

[project.urls]
Homepage = "https://github.com/spcl/FP-Arena"
Repository = "https://github.com/spcl/FP-Arena"
Issues = "https://github.com/spcl/FP-Arena/issues"
Changelog = "https://github.com/spcl/FP-Arena/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["fp_arena*"]

[tool.setuptools.package-data]
fp_arena = ["runtime/include/**/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--color=yes"
