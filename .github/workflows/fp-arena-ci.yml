name: FP-Arena Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-ci') }}
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout FP-Arena
      uses: actions/checkout@v4
      with:
        path: fp-arena

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build toolchain
      run: |
        sudo apt-get update
        # gcc/g++ (C++20) + cmake/ninja drive DaCe's CPU codegen build; the
        # generated maps use OpenMP (libgomp).
        sudo apt-get install -y cmake ninja-build gcc g++ libgomp1 libmpfr-dev

    - name: Install FP-Arena (DaCe extended from PyPI)
      run: |
        rm -f ~/.dace.conf
        python -m pip install --upgrade pip
        # dace-extended is FP-Arena's published dependency: CI tests what `pip install fp-arena` installs.
        pip install ./fp-arena
        pip install pytest

    - name: Run FP-Arena tests
      run: |
        cd fp-arena
        rm -rf .dacecache tests/.dacecache
        # Serial run: the tests compile SDFGs and share .dacecache build folders,
        # which can race under xdist.
        pytest -v tests/
